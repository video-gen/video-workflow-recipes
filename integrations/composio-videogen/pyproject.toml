[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "composio-videogen"
version = "2.5.3"
description = "Official Composio custom toolkit for the VideoGen API. Generate videos, images, voiceovers, sound effects, music, and avatars from any Composio agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.16"
keywords = [
    "videogen",
    "composio",
    "ai",
    "agents",
    "tools",
    "text-to-video",
    "ai-video-generation",
    "text-to-speech",
    "image-generation",
]

dependencies = [
    "videogen>=2.5.3",
    "composio>=0.30.0,<0.31",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://videogen.io"
Documentation = "https://github.com/video-gen/video-workflow-recipes/tree/main/integrations/composio-videogen#readme"
Repository = "https://github.com/video-gen/video-workflow-recipes"

[tool.hatch.build.targets.wheel]
packages = ["src/composio_videogen"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
markers = [
    "integration: live tests that call the VideoGen API (require VIDEOGEN_API_KEY)",
]
testpaths = ["tests"]
