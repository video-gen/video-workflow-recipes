[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-agents-videogen"
version = "2.5.3"
description = "Official OpenAI Agents SDK tools for the VideoGen API. Generate videos, images, voiceovers, sound effects, music, and avatars from any OpenAI Agents SDK agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "videogen",
    "openai-agents",
    "openai-agents-sdk",
    "ai",
    "agents",
    "tools",
    "text-to-video",
    "ai-video-generation",
    "text-to-speech",
    "image-generation",
]

dependencies = [
    "videogen>=2.5.3",
    "openai-agents>=0.1.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://videogen.io"
Documentation = "https://github.com/video-gen/video-workflow-recipes/tree/main/integrations/openai-agents-videogen#readme"
Repository = "https://github.com/video-gen/video-workflow-recipes"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_agents_videogen"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
markers = [
    "integration: live tests that call the VideoGen API (require VIDEOGEN_API_KEY)",
]
testpaths = ["tests"]
